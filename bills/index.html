<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Scanner — Absolute Living</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%236B2D5B%22 rx=%2218%22/><text x=%2250%22 y=%2266%22 font-family=%22Arial%22 font-size=%2454%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22white%22>AL</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #F5EEF3;
      min-height: 100vh;
      overflow: hidden;
    }

    .loader-overlay {
      position: fixed;
      inset: 0;
      background: #F5EEF3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.3s ease;
    }
    .loader-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-logo {
      width: 64px;
      height: 64px;
      background: #6B2D5B;
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 26px;
      letter-spacing: 1px;
      margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(107, 45, 91, 0.25);
    }

    .loader-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e7d8e0;
      border-top-color: #6B2D5B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      margin-top: 14px;
      font-size: 13px;
      color: #7a6a72;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="loader-overlay" id="loader">
    <div class="loader-logo">AL</div>
    <div class="loader-spinner"></div>
    <div class="loader-text">Loading Bill Scanner…</div>
  </div>

  <!--
    Replace the src below with your deployed Apps Script web app URL.
    Find it in Apps Script: Deploy → Manage deployments → Web app URL.
    It will look like: https://script.google.com/macros/s/AKfyc.../exec
  -->
  <iframe
    id="app"
    src="REPLACE_WITH_APPS_SCRIPT_WEB_APP_URL"
    onload="document.getElementById('loader').classList.add('hidden')"
    title="Bill Scanner"
    allow="clipboard-write">
  </iframe>

</body>
</html>
