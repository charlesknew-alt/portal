<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <!-- Lets it launch full-screen when added to a phone home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1f4e5f">
  <title>Kinfold — Contractors</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1f4e5f; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #load {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #1f4e5f; color: #fff; z-index: 2;
      font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    #load span { opacity: .85; }
  </style>
</head>
<body>
  <div id="load"><span>Loading…</span></div>

  <!-- ▼▼▼  PASTE YOUR APPS SCRIPT WEB APP URL BETWEEN THE QUOTES  ▼▼▼ -->
  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbxJUpBkMG3UbDHcDf6m-laq6J8RqWlGERW5UW7YordyC8p3SHvwfSMj0YKrKb6-KraE/exec"
    allow="clipboard-write; clipboard-read"
    onload="var l=document.getElementById('load'); if(l) l.remove();"></iframe>
  <!-- ▲▲▲  e.g. https://script.google.com/macros/s/AKfy..../exec  ▲▲▲ -->
</body>
</html>
